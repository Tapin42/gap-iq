[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gap-iq"
version = "0.1.0"
description = "Live race-tracking dashboard: division position and gaps to the racers immediately ahead and behind"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "requests>=2.28",
    # Pinned to a commit for reproducible fly.io builds; bump deliberately.
    "racedata @ git+https://github.com/Tapin42/racedata.git@main",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "capture*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: hits live upstream timing APIs; excluded from the default run",
]
